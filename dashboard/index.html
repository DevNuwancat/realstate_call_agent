<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Real Estate Call Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c; --card:#141415; --card2:#1a1a1b; --chip:#1d1d1f; --track:#232325;
  --line:rgba(255,255,255,.06); --text:#f2f1ee; --muted:#8b8a85; --muted2:#a3a29d; --dim:#6d6c68;
  --accent:#ff6b3d; --accent-hover:#ff8259; --green:#3ecf8e; --amber:#ffb02e; --red:#e5484d; --cold:#7aa2ff;
  --mono:'DM Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--accent)} a:hover{color:#ff9a78}
button{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#2a2a2c;border-radius:3px}
@keyframes ripple{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.4);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
@keyframes blink{50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

.app{height:100vh;height:100dvh;display:flex;background:var(--bg)}

/* ---------- sidebar (desktop) ---------- */
.side{width:232px;flex:none;padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid rgba(255,255,255,.05)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-weight:600;font-size:15px;line-height:1.2}
.bt{display:flex;flex-direction:column;line-height:1.2}
.bt .sub{font-weight:500;font-size:12.5px;color:var(--muted2);letter-spacing:.02em}
.logo{width:30px;height:30px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--bg);font-size:14px;font-weight:700;flex:none}
.nav{padding:11px 12px;border-radius:12px;font-size:14px;color:var(--muted2);cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:#141415;color:var(--text)}
.nav.active{background:var(--card2);font-weight:500;color:var(--accent)}
.grow{flex:1}
.server{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.server .row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.online{background:var(--green)} .dot.waking{background:var(--amber);animation:blink 1s infinite} .dot.offline{background:var(--red)}
.server .sub{font:11px/1.5 var(--mono);color:var(--muted);word-break:break-all}
.bar{height:4px;border-radius:2px;background:var(--track);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar.indet>i{width:40%!important;animation:sweep 1.2s ease-in-out infinite}
.btn-soft{border:0;border-radius:12px;padding:10px;font:500 13px 'DM Sans';cursor:pointer;background:var(--track);color:var(--text)}
.btn-soft:hover{background:#2d2d30} .btn-soft:disabled{opacity:.6;cursor:default}

/* ---------- mobile top bar ---------- */
.mbar{display:none}

/* ---------- main ---------- */
.main{flex:1;min-width:0;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head .title{flex:1;min-width:180px}
.head h1{margin:0;font-size:24px;font-weight:500;letter-spacing:-0.02em}
.head .date{font-size:13px;color:var(--muted);margin-top:2px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;color:var(--muted2);white-space:nowrap}
.pill b{color:var(--text);font-family:var(--mono);font-weight:500}
.btn-ghost{border:1px solid rgba(255,255,255,.08);background:var(--card);color:var(--text);border-radius:999px;padding:9px 16px;font:500 13px 'DM Sans';cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.btn-ghost:hover{background:#1d1d1f}
.btn-primary{border:0;background:var(--accent);color:var(--bg);border-radius:999px;padding:10px 20px;font:600 13px 'DM Sans';cursor:pointer;white-space:nowrap}
.btn-primary:hover{background:var(--accent-hover)}
.spin{display:inline-block;animation:spin .8s linear infinite}
.only-mobile{display:none}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;animation:rise .5s ease both}
.kpi .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted2);gap:8px}
.kpi .chip{font-size:11px;padding:3px 8px;border-radius:8px;white-space:nowrap}
.kpi .val{font-size:34px;font-weight:500;letter-spacing:-0.03em;margin:10px 0 6px}
.kpi .note{font-size:11px;color:var(--dim)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.card h2{margin:0;font-size:15px;font-weight:500}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted)}
.chart-wrap{position:relative;margin-top:14px}
.chart-wrap svg{width:100%;display:block}
.charts{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.mix{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.mix .r{display:flex;flex-direction:column;gap:7px}
.mix .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted2)}
.mix .t b{font:500 13px var(--mono);color:var(--text)}
.mix .tr{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.mix .tr i{display:block;height:100%;border-radius:4px;transition:width .5s}
.tip{position:absolute;top:6px;transform:translateX(-50%);background:#1d1d1f;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 12px;font-size:12px;pointer-events:none;transition:left .25s;white-space:nowrap}
.tip .d{color:var(--muted)} .tip b{font-family:var(--mono);margin-left:6px}

/* ---------- call log ---------- */
.log{padding:20px 20px 12px}
.log-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.log-head h2{flex:1;min-width:90px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter{border:0;border-radius:999px;padding:6px 13px;font:500 12px 'DM Sans';cursor:pointer;background:var(--chip);color:var(--muted2)}
.filter.on{background:var(--text);color:var(--bg)}
.filter span{opacity:.6}
.cols{display:grid;grid-template-columns:2fr 1.5fr 1.1fr .8fr 1.6fr 1.3fr 56px;gap:12px}
.cols.th{padding:10px 14px;background:var(--card2);border-radius:12px;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.rowc{padding:14px;align-items:center;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px;cursor:pointer;transition:background .2s;animation:rise .4s ease both}
.rowc:hover{background:#19191a}
.rowc .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mono{font:13px var(--mono);color:var(--muted2)}
.soft{color:var(--muted2);font-size:13px}
.segs{display:flex;gap:4px;align-items:center}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--track)}
.verdict{font-size:12px;padding:4px 10px;border-radius:8px;white-space:nowrap;display:inline-block}
.play{width:34px;height:34px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-size:11px;color:var(--accent);border:0;cursor:pointer}
.play:hover{background:var(--accent);color:var(--bg)}
.empty{padding:40px 14px;text-align:center;color:var(--muted);font-size:14px}
.skeleton{height:56px;margin:8px 0;border-radius:12px;background:linear-gradient(90deg,#171718,#1d1d1f,#171718);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.mobile-only{display:none}
.topbar{position:fixed;top:0;left:0;right:0;height:2px;z-index:50;overflow:hidden;opacity:0;transition:opacity .25s;pointer-events:none}
.topbar.on{opacity:1}
.topbar i{display:block;width:40%;height:100%;background:var(--accent);animation:sweep 1.1s ease-in-out infinite}
.shim{border-radius:8px;background:linear-gradient(90deg,#1d1d1f,#2a2a2c,#1d1d1f);background-size:200% 100%;animation:shimmer 1.4s infinite}
.verdict.proc{background:rgba(255,107,61,.14);color:var(--accent);display:inline-flex;align-items:center;gap:7px}
.verdict.proc:before{content:"";width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.segs.proc i{background:linear-gradient(90deg,#232325,#4a2d22,#232325);background-size:200% 100%;animation:shimmer 1.2s infinite}
.live-note{display:none;align-items:center;gap:8px;font-size:12px;color:var(--accent);margin:-4px 0 12px}
.live-note.on{display:flex}
.live-note:before{content:"";width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.wait{display:flex;align-items:center;gap:10px;justify-content:center;padding:6px 0 2px;font-size:13px;color:var(--muted2)}
.wait:before{content:"";width:14px;height:14px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.sumproc{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.kpi.sk{min-height:118px;display:flex;flex-direction:column;gap:12px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,5,6,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10}
.panel{position:fixed;top:12px;right:12px;bottom:12px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:24px;z-index:11;display:flex;flex-direction:column;animation:slide .4s cubic-bezier(.3,.8,.3,1);overflow:hidden}
.panel.drawer{width:480px}
.panel.prompt{width:460px;padding:26px;gap:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel.prompt>*{flex-shrink:0}
.fld{display:flex;flex-direction:column;gap:6px;flex:none}
.fld>label{font-size:12px;font-weight:600;color:var(--text);letter-spacing:.01em}
.fld{position:relative}
.fld>label{display:flex;align-items:center;gap:8px}
.info{width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);background:transparent;color:var(--muted);font:600 11px 'DM Sans';line-height:1;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.info:hover,.info.on{color:var(--text);border-color:var(--text)}
.fld-tip{font-size:12.5px;line-height:1.5;color:var(--muted2);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.fld-tip b{color:var(--accent);font-weight:600}
.mention{position:absolute;left:14px;z-index:6;min-width:170px;background:var(--card2);border:1px solid rgba(255,255,255,.14);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.5);padding:5px}
.mention button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);font:500 13px 'DM Sans';padding:8px 10px;border-radius:8px;cursor:pointer}
.mention button.on,.mention button:hover{background:var(--chip)}
.panel.prompt h3{margin:0;font-size:20px;font-weight:500;letter-spacing:-0.02em}
.panel.prompt p{margin:0;font-size:13px;color:var(--muted)}
.panel.prompt textarea{flex:none;min-height:340px;border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:16px;font:13px/1.65 var(--mono);color:var(--text);resize:none;outline:none}
.panel.prompt textarea:focus{border-color:rgba(255,107,61,.5)}
.tpl-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;flex:none;-webkit-overflow-scrolling:touch}
.tpl{border:0;border-radius:999px;padding:8px 14px;font:500 12px 'DM Sans';background:var(--chip);color:var(--muted2);white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:7px;flex:none}
.tpl:hover{background:#262628}
.tpl.on{background:var(--text);color:var(--bg)}
.tpl .d{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.tpl.add{border:1px dashed rgba(255,255,255,.22);background:transparent;color:var(--accent)}
.tpl.add.on{background:rgba(255,107,61,.14)}
.tpl-name{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 16px;font:500 14px 'DM Sans';color:var(--text);outline:none;flex:none}
.tpl-name:focus{border-color:rgba(255,107,61,.5)}
.panel.prompt textarea.tpl-first{min-height:0;flex:none;font:500 14px 'DM Sans';border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 16px;font:500 14px 'DM Sans';color:var(--text);outline:none;flex:none;height:76px;resize:none}
.tpl-status{font-size:12px;color:var(--muted);flex:none;display:flex;align-items:center;gap:7px}
.tpl-status.live{color:var(--green)}
.tpl-actions{display:flex;gap:10px;flex:none}
.tpl-actions .btn-wide{flex:1;padding:13px 10px}
.btn-sec{border:1px solid rgba(255,255,255,.14)!important;background:transparent!important;color:var(--text)!important}
.btn-sec:hover{background:var(--chip)!important}
.tpl-del{align-self:flex-start;flex:none}
.tpl-del:disabled{opacity:.4;cursor:default}
.btn-wide{border:0;background:var(--accent);color:var(--bg);border-radius:14px;padding:14px;font:600 14px 'DM Sans';cursor:pointer}
.btn-wide:hover{background:var(--accent-hover)} .btn-wide:disabled{opacity:.6;cursor:default}
.xbtn{width:32px;height:32px;border-radius:50%;background:var(--track);display:grid;place-items:center;cursor:pointer;font-size:13px;border:0;flex:none}
.xbtn:hover{background:#2d2d30}
.msg-note{font-size:12px;min-height:16px;color:var(--muted)} .msg-note.err{color:var(--red)} .msg-note.ok{color:var(--green)}

.d-head{padding:24px 26px 16px;display:flex;align-items:flex-start;gap:14px}
.d-head .who{flex:1;min-width:0}
.d-head .nm{font-size:22px;font-weight:500;letter-spacing:-0.02em;overflow:hidden;text-overflow:ellipsis}
.d-head .sub{font:13px var(--mono);color:var(--muted);margin-top:4px}
.d-head .lvl{text-align:right}
.d-head .lvl .big{font-size:22px;font-weight:500;letter-spacing:-0.02em;line-height:1.1}
.d-head .lvl .segs{margin-top:8px;width:88px;margin-left:auto}
.player{margin:0 26px;background:var(--card2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.player .top{display:flex;align-items:center;gap:14px}
.pbtn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;cursor:pointer;font-size:14px;flex:none;border:0}
.pbtn:hover{background:var(--accent-hover)} .pbtn:disabled{background:var(--track);color:var(--dim);cursor:default}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:44px}
.wave i{flex:1;border-radius:2px;background:#3a3a3d;cursor:pointer;transition:background .15s}
.wave i.on{background:var(--accent)}
.ptime{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted)}
.ptime .spd{cursor:pointer;color:var(--accent);background:none;border:0;font:inherit;padding:0}
.sec{padding:16px 26px 0}
.sec .lab{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.sec .txt{font-size:13px;line-height:1.55;margin-top:6px;color:#cfcec9}
.sec .txt.none{color:var(--dim)}
.lines{flex:1;overflow:auto;padding:18px 26px 12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.line{padding:10px 14px;border-radius:14px;background:transparent;border:1px solid rgba(255,255,255,.05);transition:all .25s}
.line.seek{cursor:pointer}
.line.act{background:var(--track);border-color:rgba(255,107,61,.5)}
.line.dim{opacity:.5}
.line .w{font-size:11px;margin-bottom:3px;color:var(--muted)} .line .w.a{color:var(--accent)}
.line .t{font-size:13.5px;line-height:1.45}
.d-foot{padding:10px 26px 20px;display:flex;gap:10px;align-items:center}
.btn-del{border:1px solid rgba(229,72,77,.35);background:transparent;color:var(--red);border-radius:12px;padding:9px 14px;font:500 13px 'DM Sans';cursor:pointer}
.btn-del:hover{background:rgba(229,72,77,.12)}

/* ---------- talk stage ---------- */
.stage-wrap{position:fixed;inset:0;background:rgba(5,5,6,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;animation:pop .3s ease both;z-index:20}
.stage{width:520px;max-width:94vw;height:620px;max-height:92vh;background:#121213;border:1px solid rgba(255,255,255,.08);border-radius:28px;overflow:hidden;position:relative;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.stage .xbtn{position:absolute;top:16px;right:16px;z-index:3}
.orbside{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.glow.go{background:radial-gradient(circle at 50% 38%,rgba(255,107,61,.22),transparent 60%)}
.glow.gg{background:radial-gradient(circle at 50% 38%,rgba(62,207,142,.24),transparent 60%)}
.orbbox{position:relative;width:260px;height:260px;display:grid;place-items:center;flex:none}
.ring{position:absolute;width:120px;height:120px;border-radius:50%;border:1.5px solid var(--accent);animation:ripple 3s ease-out infinite;transition:border-color .35s,opacity .35s}
.bub{position:absolute;border-radius:50%;background:var(--accent);transition:background-color .35s,opacity .35s}
.orbbox.g .ring{border-color:var(--green)} .orbbox.g .bub{background:var(--green)}
.orbbox.off .ring{opacity:0;animation:none}
.orb{position:relative;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a78,#ff6b3d 55%,#c8431c);transition:transform .12s ease-out,box-shadow .4s;box-shadow:0 0 70px rgba(255,107,61,.45);display:grid;place-items:center;font-size:30px;color:var(--bg);font-weight:600}
.orb .og{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9af2c6,#3ecf8e 55%,#1d9a66);opacity:0;transition:opacity .35s}
.orb .ot{position:relative}
.orbbox.g .orb{box-shadow:0 0 70px rgba(62,207,142,.5)}
.stat{text-align:center;min-height:74px}
.stat .s{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:500;transition:color .35s}
.stat .n{font:500 22px var(--mono);margin-top:8px}
.stat .t{font:13px var(--mono);color:var(--muted);margin-top:6px;min-height:18px}
.steps{display:flex;flex-direction:column;gap:10px;width:260px;margin-top:2px}
.step{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--dim);transition:color .3s}
.step i{width:18px;height:18px;border-radius:50%;border:2px solid #3a3a3d;flex:none;display:grid;place-items:center;font-size:11px;font-style:normal;line-height:1}
.step.run{color:var(--text)} .step.run i{border-color:var(--accent);border-right-color:transparent;animation:spin .8s linear infinite}
.step.done{color:var(--muted2)} .step.done i{border-color:var(--green);background:var(--green);color:var(--bg)} .step.done i:before{content:"✓";font-weight:700}
.btn-end{border:0;background:var(--red);color:#fff;border-radius:999px;padding:12px 28px;font:600 14px 'DM Sans';cursor:pointer;animation:rise .3s ease both}
.btn-start{border:0;background:var(--accent);color:var(--bg);border-radius:999px;padding:13px 32px;font:600 15px 'DM Sans';cursor:pointer;animation:rise .3s ease both}
.btn-start:hover{background:var(--accent-hover)}
.hint{font-size:12px;color:var(--muted);text-align:center;max-width:300px;line-height:1.5}
.hint.err{color:var(--red)}
.rowc.hl{background:rgba(255,107,61,.12);box-shadow:inset 3px 0 0 var(--accent);animation:hlfade 4.5s ease forwards}
@keyframes hlfade{0%,70%{background:rgba(255,107,61,.14)}100%{background:transparent;box-shadow:inset 3px 0 0 transparent}}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1f;border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:10px 18px;font-size:13px;z-index:40;animation:rise .3s ease both;max-width:90vw}

/* ---------- tablet / mobile ---------- */
@media (max-width:980px){
  .side{display:none}
  .mbar{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid rgba(255,255,255,.05);position:sticky;top:0;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5}
  .mbar .brand{padding:0;flex:1}
  .mbar .srv{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
  .app{flex-direction:column}
  .main{padding:0 0 28px;gap:14px}
  .main>*:not(.mbar){margin-left:16px;margin-right:16px}
  .main>.mbar{margin:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .charts{grid-template-columns:1fr!important}
  .only-mobile{display:flex}
}
@media (max-width:640px){
  .head h1{font-size:21px}
  .head .title{flex-basis:100%}
  .head>.pill,.head>.btn-ghost,.head>.btn-primary{flex:1 1 auto;justify-content:center;text-align:center}
  .head>.btn-primary{flex-basis:100%;padding:13px 20px;font-size:14px}
  .kpi{padding:14px 14px}
  .kpi .val{font-size:26px;margin:8px 0 4px}
  .card{padding:16px;border-radius:18px}
  .log{padding:16px 14px 6px}
  .cols.th{display:none}
  .rowc{grid-template-columns:1fr auto;grid-template-areas:"name verdict" "meta play" "segs segs";gap:8px 10px;padding:14px 4px;align-items:center}
  .rowc .c-name{grid-area:name;min-width:0}
  .rowc .c-verdict{grid-area:verdict;justify-self:end}
  .rowc .c-meta{grid-area:meta;min-width:0}
  .rowc .c-segs{grid-area:segs}
  .rowc .c-play{grid-area:play;justify-self:end}
  .rowc .c-num,.rowc .c-when,.rowc .c-dur{display:none}
  .mobile-only{display:block}
  .panel{top:0;right:0;bottom:0;left:0;width:100%!important;border-radius:0;border:0}
  .panel.prompt{padding:max(22px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
  .d-head{padding:max(20px,env(safe-area-inset-top)) 18px 14px}
  .player{margin:0 18px} .sec{padding:14px 18px 0} .lines{padding:14px 18px 10px} .d-foot{padding:10px 18px max(18px,env(safe-area-inset-bottom))}
  .stage-wrap{display:block}
  .stage{width:100%;max-width:100%;height:100dvh;max-height:100dvh;border-radius:0;border:0}
  .orbside{padding:max(56px,calc(env(safe-area-inset-top) + 40px)) 16px max(24px,env(safe-area-inset-bottom));gap:10px}
  .orbbox{width:220px;height:220px;transform:scale(.84);margin:-10px 0}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="topbar" id="topbar"><i></i></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">R</div><div class="bt"><span>Real Estate</span><span class="sub">Call Agent</span></div></div>
    <button class="nav active" id="nav-dash">Dashboard</button>
    <button class="nav" id="nav-script">Agent script</button>
    <button class="nav" id="nav-refresh">Refresh data</button>
    <div class="grow"></div>
    <div class="server">
      <div class="row"><span class="dot" id="srv-dot"></span><span id="srv-label">Checking service…</span></div>
      <div class="sub" id="srv-url"></div>
      <div class="bar" id="srv-bar"><i id="srv-fill" style="width:0%"></i></div>
      <button class="btn-soft" id="srv-btn">Check service</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="mbar">
      <div class="brand"><div class="logo">R</div><div class="bt"><span>Real Estate</span><span class="sub">Call Agent</span></div></div>
      <div class="srv" id="srv-chip"><span class="dot" id="srv-dot-m"></span><span id="srv-label-m">Checking…</span></div>
    </div>

    <div class="head">
      <div class="title">
        <h1 id="greeting">Hello</h1>
        <div class="date" id="date-line">—</div>
      </div>
      <div class="pill" id="spend-pill"><span id="spend-label">Spend</span> <b id="spend">$0.00</b></div>
      <button class="btn-ghost only-mobile" id="btn-script-m">Agent script</button>
      <button class="btn-ghost" id="btn-refresh"><span id="spin-ico">↻</span>Refresh</button>
      <button class="btn-primary" id="btn-talk">● Talk to agent</button>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="charts">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
          <h2>Calls this week</h2>
          <div class="legend"><span><span style="color:var(--accent)">●</span> Calls</span><span><span style="color:var(--green)">●</span> Interested</span></div>
        </div>
        <div class="chart-wrap" id="chart"></div>
      </div>
      <div class="card">
        <h2>Interest mix</h2>
        <div class="mix" id="mix"></div>
      </div>
    </div>

    <div class="card log">
      <div class="log-head">
        <h2>Call log</h2>
        <div class="filters" id="filters"></div>
      </div>
      <div class="live-note" id="live-note">Analyzing your latest call — this updates automatically</div>
      <div class="cols th"><div>LEAD</div><div>NUMBER</div><div>WHEN</div><div>TIME</div><div>INTEREST</div><div>VERDICT</div><div>REC</div></div>
      <div id="rows"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </main>
</div>

<div id="overlay-root"></div>

<script>
(function () {
  "use strict";

  /* ================= config ================= */
  var VAPI_PUBLIC_KEY = "b822df8b-1478-4d9f-926b-44ade85e9ece";   // public key: safe in the browser
  var VAPI_ASSISTANT_ID = "807802f9-e4e2-4e56-a50b-af024ed71260";
  var VAPI_SDK_URL = "https://cdn.jsdelivr.net/npm/@vapi-ai/web@2.7.1/+esm";
  var DEFAULT_BACKEND = "https://realstate-call-agent.onrender.com";
  // ?api=http://localhost:8000 lets you test against a local backend
  var BACKEND = (new URLSearchParams(location.search).get("api") || DEFAULT_BACKEND).replace(/\/$/, "");

  var LEVELS = {
    "hot":            { label: "Hot",            color: "#3ecf8e", bg: "rgba(62,207,142,.14)",  steps: 4 },
    "warm":           { label: "Warm",           color: "#ffb02e", bg: "rgba(255,176,46,.14)",  steps: 3 },
    "cold":           { label: "Cold",           color: "#7aa2ff", bg: "rgba(122,162,255,.14)", steps: 2 },
    "not-interested": { label: "Not interested", color: "#e5484d", bg: "rgba(229,72,77,.14)",   steps: 1 },
    "":               { label: "Not rated",        color: "#6d6c68", bg: "rgba(109,108,104,.16)", steps: 0 }
  };
  var FILTERS = [["all", "All"], ["hot", "Hot"], ["warm", "Warm"], ["cold", "Cold"], ["not-interested", "Not interested"]];

  /* ================= state ================= */
  var S = {
    calls: [], loaded: false, loadError: "", spend: 0, credit: null,
    filter: "all", hoverDay: null,
    server: "checking", latency: null, wakeSince: 0,
    syncedAt: null, refreshing: false,
    openCallId: null, media: null, mediaState: "idle", audio: null, speed: 1,
    promptOpen: false, stageOpen: false
  };

  var $ = function (id) { return document.getElementById(id); };
  var root = $("overlay-root");

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function isProcessing(c) {
    var age = Date.now() - new Date(c.updated_at || c.created_at).getTime();
    if (c.status && c.status !== "completed") return age < 10 * 60e3;       // call still running or just ended
    return !c.interest_level && age < 150e3;                                // finished; waiting for the analysis
  }
  function procLabel(c) { return /^(in-progress|queued|ringing)$/.test(c.status || "") ? "In call" : "Analyzing"; }
  function lv(call) { return LEVELS[call.interest_level] || LEVELS[""]; }
  function fmt(sec) { sec = Math.max(0, Math.round(sec || 0)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
  function isBrowser(c) { return !c.phone_number || c.phone_number === "browser-test"; }
  function callName(c) { return c.lead_name || (isBrowser(c) ? "Web caller" : c.phone_number); }
  function callNumber(c) { return isBrowser(c) ? "Browser call" : c.phone_number; }
  function segsHtml(steps, color) {
    var h = "";
    for (var i = 0; i < 4; i++) h += '<i style="' + (i < steps ? "background:" + color : "") + '"></i>';
    return '<div class="segs">' + h + "</div>";
  }
  function toast(msg) {
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200);
  }
  function dayKey(d) { return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
  function whenText(iso) {
    if (!iso) return "";
    var d = new Date(iso), now = new Date(), y = new Date(); y.setDate(now.getDate() - 1);
    var time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    if (dayKey(d) === dayKey(now)) return "Today · " + time;
    if (dayKey(d) === dayKey(y)) return "Yesterday · " + time;
    return d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
  }

  async function api(path, opts) {
    var res = await fetch(BACKEND + path, opts);
    if (!res.ok) {
      var detail = "";
      try { var j = await res.json(); if (typeof j.detail === "string" && !/vapi/i.test(j.detail)) detail = j.detail; } catch (e) {}
      throw new Error(detail || ("Something went wrong (" + res.status + ")"));
    }
    return res.json();
  }

  /* ================= service status (the host sleeps when idle) ================= */
  function renderServer() {
    var map = {
      checking: ["Checking service…", "waking", "Connecting"],
      waking:   ["Starting up…", "waking", "This can take up to a minute"],
      online:   ["Service online", "online", S.latency != null ? "Responding · " + S.latency + "ms" : "Responding"],
      offline:  ["Service unreachable", "offline", "Please try again shortly"]
    }[S.server];
    $("srv-label").textContent = map[0];
    $("srv-label-m").textContent = S.server === "online" ? "Online" : S.server === "offline" ? "Offline" : "Starting…";
    ["srv-dot", "srv-dot-m"].forEach(function (id) { $(id).className = "dot " + map[1]; });
    $("srv-url").innerHTML = "Call service<br>" + esc(map[2]);
    var busy = S.server === "checking" || S.server === "waking";
    $("srv-bar").className = "bar" + (busy ? " indet" : "");
    $("srv-fill").style.width = S.server === "online" ? "100%" : busy ? "40%" : "0%";
    $("srv-btn").disabled = busy;
    if (!S.loaded && !S.loadError) renderRows();
    $("srv-btn").textContent = busy ? "Starting…" : S.server === "offline" ? "Retry" : "Check service";
  }

  async function pingServer() {
    var t0 = performance.now();
    var slow = setTimeout(function () { if (S.server === "checking") { S.server = "waking"; renderServer(); } }, 2500);
    S.server = S.server === "online" ? "online" : "checking"; renderServer();
    try {
      var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 90000);
      var res = await fetch(BACKEND + "/health", { signal: ctl.signal });
      clearTimeout(to);
      if (!res.ok) throw new Error("bad status");
      S.latency = Math.round(performance.now() - t0);
      S.server = "online";
    } catch (e) {
      S.server = "offline";
    }
    clearTimeout(slow);
    renderServer();
    return S.server === "online";
  }

  /* ================= data ================= */
  async function loadData(quiet) {
    if (!quiet) { S.refreshing = true; renderRefresh(); }
    try {
      var results = await Promise.all([
        api("/calls?limit=200"),
        api("/usage").catch(function () { return null; })
      ]);
      S.calls = results[0];
      if (results[1]) { S.spend = results[1].total_cost || 0; S.credit = results[1].credit_remaining; }
      S.loadError = ""; S.loaded = true; S.syncedAt = new Date(); S.lastLoad = Date.now();
      if (S.server !== "online") { S.server = "online"; renderServer(); }
    } catch (e) {
      S.loadError = e.message || "Could not load calls";
      S.loaded = true;
    }
    S.refreshing = false;
    renderAll();
  }

  function renderRefresh() {
    var proc = S.calls.some(isProcessing);
    $("spin-ico").className = S.refreshing ? "spin" : "";
    $("topbar").className = "topbar" + (S.refreshing || proc || !S.loaded ? " on" : "");
    $("live-note").className = "live-note" + (proc ? " on" : "");
  }

  /* ================= dashboard render ================= */
  function renderHeader() {
    var h = new Date().getHours();
    $("greeting").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    var d = new Date().toLocaleDateString([], { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    $("date-line").textContent = d + " · synced " + (S.syncedAt ? S.syncedAt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "never");
    var hasCredit = typeof S.credit === "number";
    $("spend-label").textContent = hasCredit ? "Credit left" : "Spend";
    $("spend").textContent = "$" + (hasCredit ? S.credit : S.spend).toFixed(2);
    $("spend-pill").title = "Spent on calls so far: $" + S.spend.toFixed(2);
  }

  function renderKpis() {
    if (!S.loaded) { $("kpis").innerHTML = [0, 1, 2, 3].map(function () { return '<div class="kpi sk"><div class="shim" style="height:14px;width:55%"></div><div class="shim" style="height:34px;width:40%"></div><div class="shim" style="height:10px;width:70%"></div></div>'; }).join(""); return; }
    var now = Date.now(), W = 7 * 864e5;
    var cur = S.calls.filter(function (c) { return now - new Date(c.created_at) < W; }).length;
    var prev = S.calls.filter(function (c) { var a = now - new Date(c.created_at); return a >= W && a < 2 * W; }).length;
    var total = S.calls.length;
    var interested = S.calls.filter(function (c) { return c.interest_level === "hot" || c.interest_level === "warm"; }).length;
    var not = S.calls.filter(function (c) { return c.interest_level === "not-interested"; }).length;
    var durs = S.calls.filter(function (c) { return c.duration_seconds > 0; });
    var avg = durs.length ? durs.reduce(function (a, c) { return a + c.duration_seconds; }, 0) / durs.length : 0;
    var pct = function (n) { return total && n ? Math.round(n / total * 100) + "%" : ""; };

    var delta = "", up = true;
    if (prev > 0) { var p = Math.round((cur - prev) / prev * 100); delta = (p >= 0 ? "+" : "") + p + "%"; up = p >= 0; }
    else if (cur > 0) delta = "new";

    var cards = [
      { label: "Total calls", value: total, chip: delta, up: up, note: cur + " in the last 7 days" },
      { label: "Interested leads", value: interested, chip: pct(interested), up: true, note: "Hot + warm" },
      { label: "Not interested", value: not, chip: pct(not), up: false, note: "Asked to stop or said no" },
      { label: "Avg call length", value: avg ? fmt(avg) : "—", chip: "", up: true, note: durs.length + " timed calls" }
    ];
    $("kpis").innerHTML = cards.map(function (k, i) {
      var chip = k.chip ? '<span class="chip" style="background:' + (k.up ? "rgba(62,207,142,.14)" : "rgba(255,107,61,.14)") + ";color:" + (k.up ? "#3ecf8e" : "#ff6b3d") + '">' + esc(k.chip) + "</span>" : "";
      return '<div class="kpi" style="animation-delay:' + i * 60 + 'ms"><div class="top">' + esc(k.label) + chip + '</div><div class="val">' + esc(k.value) + '</div><div class="note">' + esc(k.note) + "</div></div>";
    }).join("");
  }

  function renderChart() {
    if (!S.loaded) { $("chart").innerHTML = '<div class="shim" style="height:200px"></div>'; return; }
    var days = [], i;
    for (i = 6; i >= 0; i--) { var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); days.push({ date: d, calls: 0, interested: 0 }); }
    S.calls.forEach(function (c) {
      var k = dayKey(new Date(c.created_at));
      days.forEach(function (x) {
        if (dayKey(x.date) === k) { x.calls++; if (c.interest_level === "hot" || c.interest_level === "warm") x.interested++; }
      });
    });
    var max = Math.max(4, Math.max.apply(null, days.map(function (x) { return x.calls; })));
    max = Math.ceil(max / 2) * 2;
    var X = function (n) { return 56 + n * 88; }, Y = function (v) { return 190 - v / max * 170; };
    var path = function (pts) {
      var d = "M" + pts[0][0] + " " + pts[0][1];
      for (var n = 0; n < pts.length - 1; n++) {
        var p0 = pts[n - 1] || pts[n], p1 = pts[n], p2 = pts[n + 1], p3 = pts[n + 2] || p2;
        var cl = function (y) { return Math.max(20, Math.min(190, y)); };   // keep the curve inside the chart
        d += " C" + (p1[0] + (p2[0] - p0[0]) / 6) + " " + cl(p1[1] + (p2[1] - p0[1]) / 6) + "," + (p2[0] - (p3[0] - p1[0]) / 6) + " " + cl(p2[1] - (p3[1] - p1[1]) / 6) + "," + p2[0] + " " + p2[1];
      }
      return d;
    };
    var callPts = days.map(function (x, n) { return [X(n), Y(x.calls)]; });
    var intPts = days.map(function (x, n) { return [X(n), Y(x.interested)]; });
    var hi = S.hoverDay == null ? 6 : S.hoverDay, hd = days[hi];
    var lp = path(callPts);
    var grid = [0, max / 2, max].map(function (v) {
      return '<line x1="36" x2="600" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="rgba(255,255,255,.06)" stroke-dasharray="3 5"></line><text x="0" y="' + (Y(v) + 3) + '" fill="#6d6c68" font-size="10">' + v + "</text>";
    }).join("");
    var labels = days.map(function (x, n) {
      return '<text x="' + X(n) + '" y="212" fill="#6d6c68" font-size="11" text-anchor="middle">' + x.date.toLocaleDateString([], { weekday: "short" }) + '</text><rect data-day="' + n + '" x="' + (X(n) - 44) + '" y="0" width="88" height="200" fill="transparent"></rect>';
    }).join("");
    var tipLeft = Math.max(14, Math.min(86, X(hi) / 6));
    $("chart").innerHTML =
      '<svg viewBox="0 0 600 220" role="img" aria-label="Calls per day for the last 7 days"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b3d" stop-opacity=".28"></stop><stop offset="1" stop-color="#ff6b3d" stop-opacity="0"></stop></linearGradient></defs>' +
      grid +
      '<path d="' + lp + " L" + X(6) + " 190 L" + X(0) + ' 190 Z" fill="url(#ar)"></path>' +
      '<path d="' + path(intPts) + '" fill="none" stroke="#3ecf8e" stroke-width="2" stroke-linecap="round" opacity=".85"></path>' +
      '<path d="' + lp + '" fill="none" stroke="#ff6b3d" stroke-width="3" stroke-linecap="round"></path>' +
      '<line x1="' + X(hi) + '" x2="' + X(hi) + '" y1="8" y2="190" stroke="rgba(255,255,255,.25)" stroke-dasharray="3 4"></line>' +
      '<circle cx="' + X(hi) + '" cy="' + Y(hd.calls) + '" r="6" fill="#ff6b3d" stroke="#141415" stroke-width="3"></circle>' +
      labels + "</svg>" +
      '<div class="tip" style="left:' + tipLeft + '%"><div class="d">' + hd.date.toLocaleDateString([], { weekday: "long", day: "numeric", month: "short" }) + '</div><div style="margin-top:4px"><span style="color:#ff6b3d">●</span> Calls <b>' + hd.calls + '</b></div><div style="margin-top:2px"><span style="color:#3ecf8e">●</span> Interested <b>' + hd.interested + "</b></div></div>";
  }

  function renderMix() {
    if (!S.loaded) { $("mix").innerHTML = [0, 1, 2, 3, 4].map(function () { return '<div class="shim" style="height:30px"></div>'; }).join(""); return; }
    var total = S.calls.length;
    var order = ["hot", "warm", "cold", "not-interested", ""];
    $("mix").innerHTML = order.map(function (k) {
      var l = LEVELS[k], n = S.calls.filter(function (c) { return (c.interest_level || "") === k; }).length;
      var pct = total ? Math.round(n / total * 100) : 0;
      return '<div class="r"><div class="t"><span>' + l.label + '</span><b>' + n + (total ? " · " + pct + "%" : "") + '</b></div><div class="tr"><i style="width:' + pct + "%;background:" + l.color + '"></i></div></div>';
    }).join("");
  }

  function renderFilters() {
    $("filters").innerHTML = FILTERS.map(function (f) {
      var n = f[0] === "all" ? S.calls.length : S.calls.filter(function (c) { return c.interest_level === f[0]; }).length;
      return '<button class="filter' + (S.filter === f[0] ? " on" : "") + '" data-filter="' + f[0] + '">' + f[1] + " <span>" + n + "</span></button>";
    }).join("");
  }

  function renderRows() {
    var el = $("rows");
    if (!S.loaded) {
      var starting = S.server === "waking" || S.server === "checking";
      el.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>' + (starting ? '<div class="wait">Starting the service — this can take up to a minute…</div>' : "");
      return;
    }
    if (S.loadError) {
      el.innerHTML = '<div class="empty">We couldn’t load your calls right now.<br><br><button class="btn-soft" id="retry-load" style="padding:10px 18px">Try again</button></div>';
      return;
    }
    var list = S.calls.filter(function (c) { return S.filter === "all" || c.interest_level === S.filter; });
    if (!list.length) {
      el.innerHTML = '<div class="empty">' + (S.calls.length ? "No calls match this filter." : "No calls yet. Press “Talk to agent” to make your first one.") + "</div>";
      return;
    }
    el.innerHTML = list.map(function (c, i) {
      var l = lv(c), proc = isProcessing(c);

  }

  function renderAll() { renderHeader(); renderKpis(); renderChart(); renderMix(); renderFilters(); renderRows(); renderRefresh(); renderServer(); }

  /* ================= call drawer ================= */
  function closeOverlays() { stopAudio(); S.openCallId = null; S.promptOpen = false; root.innerHTML = ""; }
  function stopAudio() { if (S.audio) { try { S.audio.pause(); } catch (e) {} S.audio = null; } }

  function parseTranscript(text) {
    return (text || "").split(/\n+/).map(function (ln) {
      var m = ln.match(/^(AI|User):\s*(.*)$/);
      return m && m[2] ? { who: m[1] === "AI" ? "agent" : "lead", text: m[2], start: null } : null;
    }).filter(Boolean);
  }

  async function openCall(id, autoplay) {
    var call = S.calls.filter(function (c) { return c.vapi_call_id === id; })[0];
    if (!call) return;
    stopAudio();
    S.openCallId = id; S.media = null; S.mediaState = "loading"; S.speed = 1; S.promptOpen = false;
    drawDrawer(call);
    try {
      var media = await api("/calls/" + encodeURIComponent(id) + "/media");
      if (S.openCallId !== id) return;
      S.media = media;
      S.mediaState = media.recording_url ? "ready" : "none";
    } catch (e) {
      if (S.openCallId !== id) return;
      S.mediaState = "error";
    }
    drawDrawer(call);
    if (S.mediaState === "ready") setupAudio(call, autoplay);
  }

  function waveBars(id) {
    var seed = 0; for (var i = 0; i < id.length; i++) seed = (seed * 31 + id.charCodeAt(i)) % 997;
    var bars = [];
    for (var n = 0; n < 52; n++) bars.push(6 + Math.abs(Math.sin(n * 0.9 + seed) * Math.cos(n * 0.37 + seed * 0.3)) * 30 + ((n * 7) % 5));
    return bars;
  }

  function lvlHtml(call) {
    var l = lv(call);
    if (isProcessing(call)) return '<div class="big" style="color:var(--accent)">' + procLabel(call) + '…</div>' + segsHtml(4, "").replace('class="segs"', 'class="segs proc"');
    return '<div class="big" style="color:' + l.color + '">' + l.label + "</div>" + segsHtml(l.steps, l.color);
  }
  function sumHtml(call) {
    var lab = '<div class="lab">SUMMARY</div>';
    if (call.summary) return lab + '<div class="txt">' + esc(call.summary) + "</div>";
    if (isProcessing(call)) return lab + '<div class="sumproc"><div class="shim" style="height:12px;width:92%"></div><div class="shim" style="height:12px;width:78%"></div><div class="shim" style="height:12px;width:60%"></div></div>';
    return lab + '<div class="txt none">No summary available for this call.</div>';
  }
  // Called after each background refresh: update the open call's rating/summary without redrawing (keeps audio playing).
  function refreshDrawerMeta() {
    if (!S.openCallId || !$("d-lvl")) return;
    var call = S.calls.filter(function (c) { return c.vapi_call_id === S.openCallId; })[0];
    if (!call) return;
    $("d-lvl").innerHTML = lvlHtml(call); $("d-sum").innerHTML = sumHtml(call);
  }

  function drawDrawer(call) {
    var l = lv(call);
    var lines = (S.media && S.media.lines && S.media.lines.length) ? S.media.lines : parseTranscript(call.transcript);
    var seekable = S.mediaState === "ready" && lines.some(function (x) { return x.start != null; });
    var bars = waveBars(call.vapi_call_id).map(function (h, i) { return '<i data-bar="' + i + '" style="height:' + h + 'px"></i>'; }).join("");
    var recMsg = S.mediaState === "loading" ? "Loading recording…" : S.mediaState === "none" ? "No recording for this call" : S.mediaState === "error" ? "Recording unavailable right now" : "";
    var linesHtml = lines.length ? lines.map(function (x, i) {
      return '<div class="line' + (seekable ? " seek" : "") + '" data-line="' + i + '"><div class="w ' + (x.who === "agent" ? "a" : "") + '">' + (x.who === "agent" ? "Agent" : "Lead") + '</div><div class="t">' + esc(x.text) + "</div></div>";
    }).join("") : '<div class="empty" style="padding:20px 0">No transcript yet.</div>';

    root.innerHTML =
      '<div class="scrim" data-close></div>' +
      '<div class="panel drawer" role="dialog" aria-label="Call details">' +
        '<div class="d-head"><div class="who"><div class="nm">' + esc(callName(call)) + '</div><div class="sub">' + esc(callNumber(call)) + " · " + (call.duration_seconds ? fmt(call.duration_seconds) : "—") + " · " + esc(whenText(call.created_at)) + '</div></div>' +
          '<div class="lvl" id="d-lvl">' + lvlHtml(call) + "</div>" +
          '<button class="xbtn" data-close aria-label="Close">✕</button></div>' +
        '<div class="player"><div class="top"><button class="pbtn" id="pbtn" ' + (S.mediaState === "ready" ? "" : "disabled") + ' aria-label="Play or pause">▶</button><div class="wave" id="wave">' + bars + "</div></div>" +
          '<div class="ptime"><span id="cur">0:00</span>' + (recMsg ? "<span>" + recMsg + "</span>" : '<button class="spd" id="spd">' + S.speed + 'x</button>') + '<span id="tot">' + fmt(call.duration_seconds) + "</span></div></div>" +
        '<div class="sec" id="d-sum">' + sumHtml(call) + "</div>" +
        '<div class="lines" id="lines">' + linesHtml + "</div>" +
        '<div class="d-foot"><button class="btn-del" id="btn-del">Delete call</button><span class="msg-note" id="del-note"></span></div>' +
      "</div>";
  }

  function setupAudio(call, autoplay) {
    var a = new Audio(); a.preload = "metadata"; a.src = S.media.recording_url; S.audio = a;
    var lines = S.media.lines || [], pbtn = $("pbtn"), wave = $("wave");
    var total = function () { return isFinite(a.duration) && a.duration > 0 ? a.duration : (call.duration_seconds || 0); };
    var paint = function () {
      var t = total(), pct = t ? a.currentTime / t : 0, bars = wave ? wave.children : [];
      for (var i = 0; i < bars.length; i++) bars[i].className = i / bars.length < pct ? "on" : "";
      if ($("cur")) $("cur").textContent = fmt(a.currentTime);
      if ($("tot")) $("tot").textContent = fmt(t);
      var started = !a.paused || a.currentTime > 0, act = -1;
      lines.forEach(function (x, i) { if (x.start != null && x.start <= a.currentTime) act = i; });
      var els = document.querySelectorAll("#lines .line");
      els.forEach(function (el, i) {
        el.classList.toggle("act", started && i === act);
        el.classList.toggle("dim", started && act >= 0 && i !== act);
      });
      if (!a.paused && act >= 0 && els[act]) els[act].scrollIntoView({ block: "nearest", behavior: "smooth" });
    };
    a.addEventListener("timeupdate", paint);
    a.addEventListener("loadedmetadata", paint);
    a.addEventListener("play", function () { pbtn.textContent = "❚❚"; });
    a.addEventListener("pause", function () { pbtn.textContent = "▶"; });
    a.addEventListener("ended", function () { pbtn.textContent = "▶"; a.currentTime = 0; paint(); });
    a.addEventListener("error", function () { var t = document.querySelector(".ptime span:nth-child(2)"); if (t) t.textContent = "Could not play recording"; pbtn.disabled = true; });
    pbtn.onclick = function () { a.paused ? a.play().catch(function () {}) : a.pause(); };
    wave.onclick = function (e) {
      var el = e.target.closest("[data-bar]"); if (!el) return;
      var t = total(); if (t) { a.currentTime = (+el.dataset.bar) / wave.children.length * t; paint(); }
    };
    var spd = $("spd");
    if (spd) spd.onclick = function () { S.speed = S.speed === 1 ? 1.5 : S.speed === 1.5 ? 2 : 1; a.playbackRate = S.speed; spd.textContent = S.speed + "x"; };
    $("lines").onclick = function (e) {
      var el = e.target.closest("[data-line]"); if (!el) return;
      var x = lines[+el.dataset.line]; if (x && x.start != null) { a.currentTime = x.start; a.play().catch(function () {}); }
    };
    if (autoplay) a.play().catch(function () {});
  }

  async function deleteCall() {
    var id = S.openCallId, btn = $("btn-del"), note = $("del-note");
    if (!id) return;
    if (btn.dataset.armed !== "1") {
      btn.dataset.armed = "1"; btn.textContent = "Click again to confirm";

      return;

    btn.disabled = true; note.textContent = "Deleting…"; note.className = "msg-note";
    try {

    }
  }

  /* ================= agent script panel (templates) ================= */
  var P = { list: [], sel: null, busy: false };   // sel = template id, or null while writing a new one
  var NEW_TEXT = "You are a friendly assistant making a short phone call.\n\nGoals:\n1. \n2. \n\nStyle: short sentences, never pushy. If the person isn’t interested, thank them politely and end the call.";

  var TAGS = [["@Agent name", "{{agent_name}}"], ["@Lead name", "{{lead_name}}"]];
  function toUi(t) { TAGS.forEach(function (g) { t = t.split(g[1]).join(g[0]); t = t.split(g[1].replace("{{", "{{ ").replace("}}", " }}")).join(g[0]); }); return t; }
  function fromUi(t) { TAGS.forEach(function (g) { t = t.split(g[0]).join(g[1]); }); return t; }

  // Typing "@" in a box opens a small menu to insert the agent / lead name.
  function attachMention(ta) {
    var box = document.createElement("div"); box.className = "mention"; box.hidden = true; ta.parentNode.appendChild(box);
    var items = [], idx = 0, start = -1;
    function close() { box.hidden = true; start = -1; }
    function pick(i) {
      var tag = items[i]; if (!tag) return;
      var end = ta.selectionStart;
      ta.value = ta.value.slice(0, start) + tag[0] + " " + ta.value.slice(end);
      var pos = start + tag[0].length + 1; ta.setSelectionRange(pos, pos); ta.focus(); close();
    }
    function draw() { box.innerHTML = items.map(function (g, i) { return '<button type="button" data-i="' + i + '" class="' + (i === idx ? "on" : "") + '">' + g[0] + "</button>"; }).join(""); }
    ta.addEventListener("input", function () {
      var m = /@([A-Za-z ]{0,10})$/.exec(ta.value.slice(0, ta.selectionStart));
      if (!m) return close();
      var q = m[1].toLowerCase();
      items = TAGS.filter(function (g) { return g[0].toLowerCase().slice(1).indexOf(q) === 0; });
      if (!items.length) return close();
      start = ta.selectionStart - m[0].length; idx = 0; draw();
      box.style.top = (ta.offsetTop + 44) + "px"; box.hidden = false;
    });
    ta.addEventListener("keydown", function (e) {
      if (box.hidden) return;
      if (e.key === "ArrowDown") { idx = (idx + 1) % items.length; draw(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { idx = (idx + items.length - 1) % items.length; draw(); e.preventDefault(); }
      else if (e.key === "Enter" || e.key === "Tab") { pick(idx); e.preventDefault(); }
      else if (e.key === "Escape") { close(); e.stopPropagation(); e.preventDefault(); }
    });
    ta.addEventListener("blur", function () { setTimeout(close, 150); });
    box.addEventListener("mousedown", function (e) { var b = e.target.closest("button"); if (b) { e.preventDefault(); pick(+b.dataset.i); } });
  }

  function tplById(id) { return P.list.filter(function (t) { return t.id === id; })[0]; }
  function tplNote(msg, kind) { var n = $("prompt-note"); if (n) { n.textContent = msg || ""; n.className = "msg-note" + (kind ? " " + kind : ""); } }

  function renderTemplates() {
    var row = $("tpl-row"); if (!row) return;

      return '<button class="tpl' + (t.id === P.sel ? " on" : "") + '" data-tpl="' + esc(t.id) + '">' + (t.active ? '<span class="d"></span>' : "") + esc(t.name) + "</button>";

    $("tpl-use").textContent = t && t.active ? "Save & keep active" : "Use for calls";
    $("tpl-del").style.display = P.sel === null ? "none" : "";
    $("tpl-del").disabled = !!(t && t.active);

  function showTemplate(id) {

  }

  function setTplBusy(b) {
    P.busy = b;
    ["tpl-save", "tpl-use", "tpl-del"].forEach(function (id) { var e = $(id); if (e) e.disabled = b || (id === "tpl-del" && !!(tplById(P.sel) && tplById(P.sel).active)); });
  }

  // Saves the editor (create or update). Returns the saved template.
  async function saveTemplate() {
    var name = $("tpl-name").value.trim(), prompt = fromUi($("prompt-text").value.trim());
    if (!name) throw new Error("Give the template a name.");
    if (!prompt) throw new Error("The script can’t be empty.");

    var saved = P.sel === null

      : await api("/templates/" + encodeURIComponent(P.sel), { method: "PUT", headers: h, body: body });
    var idx = P.list.findIndex(function (t) { return t.id === saved.id; });
    if (idx >= 0) P.list[idx] = saved; else P.list.push(saved);
    P.sel = saved.id;
    return saved;
  }

  async function openPrompt() {

    root.innerHTML =

  /* ================= talk stage ================= */
  var T = { vapi: null, phase: "setup", secs: 0, clock: null, level: 0, speaker: null, leadUntil: 0, err: "", tick: 0, anim: null, known: {}, steps: [] };
  var STEP_TEXT = ["Call ended", "Saving the recording and transcript", "Writing the summary", "Rating the lead’s interest"];
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  function orbMarkup() {
    var rings = "", bubs = "";
    for (var i = 0; i < 3; i++) rings += '<div class="ring" style="animation-delay:' + i + 's"></div>';
    for (var k = 0; k < 8; k++) bubs += '<div class="bub" data-b="' + k + '"></div>';
    return '<div class="orbbox off" id="orbbox">' + rings + bubs + '<div class="orb" id="orb"><span class="og" id="orb-g"></span><span class="ot" id="orb-t">A</span></div></div>';
  }

  function stageSig() { return T.phase + "|" + T.err + "|" + T.steps.join(","); }

  function buildStage() {
    var side = $("orbside"); if (!side) return;
    var ph = T.phase;
    var action = ph === "setup" ? '<button class="btn-start" id="stage-start">Start call</button>'
      : (ph === "live" || ph === "connecting" || ph === "waking") ? '<button class="btn-end" id="stage-end">' + (ph === "live" ? "End call" : "Cancel") + "</button>" : "";
    var steps = (ph === "analyzing" || ph === "done") ? '<div class="steps">' + STEP_TEXT.map(function (t, n) {
      return '<div class="step ' + (T.steps[n] || "pend") + '"><i></i>' + t + "</div>";
    }).join("") + "</div>" : "";
    var hint = T.err ? '<div class="hint err">' + esc(T.err) + "</div>" : ph === "setup" ? '<div class="hint">Talk to the agent right in your browser. Allow microphone access when asked.</div>' : "";
    side.innerHTML = '<div class="glow go" id="glow-o"></div><div class="glow gg" id="glow-g"></div>' + orbMarkup() +
      '<div class="stat"><div class="s" id="st-label"></div><div class="n">Browser call</div><div class="t" id="st-t"></div></div>' + steps + action + hint;
    side.dataset.sig = stageSig();
    var s1 = $("stage-start"), e1 = $("stage-end");
    if (s1) s1.onclick = startTalk;
    if (e1) e1.onclick = endTalk;
  }

  // Runs every 150ms: moves the ball, bubbles and glow; swaps colour (green = agent speaking, orange = you).
  function animateOrb() {
    var side = $("orbside"); if (!side) return;
    if (side.dataset.sig !== stageSig()) buildStage();
    var ph = T.phase, now = Date.now();
    if (T.speaker === "lead" && now > T.leadUntil) T.speaker = null;
    var active = ph === "waking" || ph === "connecting" || ph === "live" || ph === "analyzing";
    var green = ph === "done" || (ph === "live" && T.speaker === "agent");
    var lvl = 0.12;
    if (ph === "live") lvl = T.speaker === "agent" ? Math.max(T.level, 0.28) : T.speaker === "lead" ? 0.3 + 0.2 * Math.abs(Math.sin(T.tick * 0.55)) : 0.1;
    else if (ph === "analyzing") lvl = 0.2 + 0.08 * Math.sin(T.tick * 0.4);
    else if (ph === "done") lvl = 0.3;

    var box = $("orbbox"); if (!box) return;
    box.className = "orbbox" + (green ? " g" : "") + (active || ph === "done" ? "" : " off");
    var bubs = box.querySelectorAll(".bub");
    for (var i = 0; i < bubs.length; i++) {
      var ang = i * 0.785 + T.tick * 0.025 * (i % 2 ? 1 : -1), r = 92 + 14 * Math.sin(T.tick * 0.15 + i) + lvl * 26, sz = (7 + (i % 3) * 5) * (0.7 + lvl);
      var st = bubs[i].style;
      st.left = (130 + Math.cos(ang) * r - sz / 2) + "px"; st.top = (130 + Math.sin(ang) * r - sz / 2) + "px";
      st.width = st.height = sz + "px"; st.opacity = (active || ph === "done") ? (0.25 + lvl * 0.5).toFixed(2) : "0";
    }
    $("orb").style.transform = "scale(" + (active ? 1 + lvl * 0.25 : 1 + 0.03 * Math.sin(T.tick * 0.2)) + ")";
    $("orb-g").style.opacity = green ? 1 : 0;
    $("orb-t").textContent = ph === "done" ? "✓" : "A";
    $("glow-o").style.opacity = active && !green ? 1 : 0.35;
    $("glow-g").style.opacity = green ? 1 : 0;

    var lab = { setup: "READY", waking: "STARTING THE SERVICE", connecting: "CONNECTING", analyzing: "ANALYZING YOUR CALL", done: "ALL DONE" }[ph];
    if (ph === "live") lab = T.speaker === "agent" ? "AGENT SPEAKING" : T.speaker === "lead" ? "YOU’RE SPEAKING" : "CONNECTED";
    var l = $("st-label"); l.textContent = lab; l.style.color = green ? "var(--green)" : "var(--accent)";
    var timer = ph === "live" ? fmt(T.secs) : ph === "waking" ? "This can take up to a minute" : ph === "analyzing" ? "This usually takes a few seconds" : ph === "done" ? "Opening your call log…" : "";
    var t = $("st-t"); if (t.textContent !== timer) t.textContent = timer;
  }

  function openStage() {
    stopAudio(); S.openCallId = null; S.promptOpen = false; S.stageOpen = true;
    T.phase = "setup"; T.secs = 0; T.level = 0; T.speaker = null; T.err = ""; T.steps = [];
    root.innerHTML = '<div class="stage-wrap"><div class="stage" role="dialog" aria-label="Talk to the agent"><button class="xbtn" id="stage-x" aria-label="Close">✕</button><div class="orbside" id="orbside"></div></div></div>';
    buildStage(); animateOrb();
    clearInterval(T.anim);
    T.anim = setInterval(function () { T.tick++; if (T.level > 0) T.level *= 0.88; animateOrb(); }, 150);
  }

  function closeStage() {
    clearInterval(T.anim); clearInterval(T.clock);
    if (T.vapi && (T.phase === "live" || T.phase === "connecting")) { try { T.vapi.stop(); } catch (e) {} }
    S.stageOpen = false; T.phase = "setup"; root.innerHTML = "";
  }

  async function startTalk() {
    T.err = ""; T.secs = 0; T.speaker = null;
    // Make sure the host is awake first, otherwise the end-of-call report can time out and the call isn't saved.
    if (S.server !== "online") {
      T.phase = "waking";
      var ok = await pingServer();
      if (!S.stageOpen) return;
      if (!ok) { T.phase = "setup"; T.err = "The service is still starting up, so the call can’t be saved yet. Please try again in a minute."; return; }
    }
    T.known = {}; S.calls.forEach(function (c) { T.known[c.vapi_call_id] = true; });
    T.phase = "connecting";
    try {
      if (!T.vapi) {
        var mod = await import(VAPI_SDK_URL);
        var Vapi = mod.default && mod.default.default ? mod.default.default : (mod.default || mod.Vapi);
        T.vapi = new Vapi(VAPI_PUBLIC_KEY);
        wireVapi(T.vapi);
      }
      if (!S.stageOpen) return;
      await T.vapi.start(VAPI_ASSISTANT_ID);
    } catch (e) {
      console.warn(e); T.phase = "setup";
      T.err = (e && e.name === "NotAllowedError") ? "Microphone access was blocked. Allow it in your browser and try again." : "Could not start the call. Check your microphone and connection, then try again.";
    }
  }

  function wireVapi(v) {
    v.on("call-start", function () {
      T.phase = "live"; T.secs = 0; clearInterval(T.clock);
      T.clock = setInterval(function () { T.secs++; }, 1000);
    });
    v.on("volume-level", function (lvl) { T.level = Math.max(T.level, Math.min(1, lvl * 1.6)); });
    v.on("speech-start", function () { T.speaker = "agent"; });
    v.on("speech-end", function () { if (T.speaker === "agent") T.speaker = null; });
    v.on("message", function (m) {
      if (!m) return;
      if (m.type === "speech-update") {
        var who = m.role === "assistant" ? "agent" : "lead";
        if (m.status === "started") { T.speaker = who; T.leadUntil = who === "lead" ? Date.now() + 8000 : 0; }
        else if (T.speaker === who) T.speaker = null;
      } else if (m.type === "transcript" && m.role === "user") {
        T.speaker = "lead"; T.leadUntil = Date.now() + 1500;
      }
    });
    v.on("call-end", function () {
      clearInterval(T.clock);
      if (!S.stageOpen) return;
      T.speaker = null;
      afterCall();
    });
    v.on("error", function (e) {
      if (!S.stageOpen) return;
      if (T.phase === "live" || T.phase === "analyzing") return;           // ignore noisy errors during a call
      console.warn("call error", e); T.phase = "setup"; T.err = "The call couldn’t be completed. Please try again.";
    });
  }

  function endTalk() {
    if (T.phase === "live" || T.phase === "connecting") { try { T.vapi && T.vapi.stop(); } catch (e) {} }
    if (T.phase === "waking" || T.phase === "connecting") T.phase = "setup";
  }

  // After hang-up: show a checklist while the call is saved, summarised and rated. Each tick of the list
  // reflects what is really in the database, then we close the window and highlight the new call in the log.
  async function afterCall() {
    T.phase = "analyzing"; T.steps = ["done", "run", "pend", "pend"];
    var t0 = Date.now(), found = null, completedAt = 0, finished = false;
    while (S.stageOpen && Date.now() - t0 < 90000 && !finished) {
      await sleep(3000);
      if (!S.stageOpen) return;
      await loadData(true);
      found = S.calls.filter(function (c) { return !T.known[c.vapi_call_id]; })[0] || null;
      var st = ["done", "run", "pend", "pend"];
      if (found && found.status === "completed") {
        if (!completedAt) completedAt = Date.now();
        var since = Date.now() - completedAt, hasInt = !!found.interest_level, hasSum = !!found.summary;
        st[1] = "done";
        st[2] = (hasSum || hasInt || since > 20000) ? "done" : "run";
        st[3] = st[2] === "done" ? "run" : "pend";
        if (hasInt || since > 45000) { st = ["done", "done", "done", "done"]; finished = true; }
      }
      T.steps = st;
    }
    if (!S.stageOpen) return;
    if (!found) { closeStage(); toast("Your call is still being processed. It will appear shortly."); return; }
    T.phase = "done"; T.steps = ["done", "done", "done", "done"];
    await sleep(1400);
    if (!S.stageOpen) return;
    closeStage();
    highlightCall(found.vapi_call_id);
  }

  function highlightCall(id) {
    S.highlightId = id; S.rowsShown = true; S.filter = "all"; renderFilters(); renderRows();
    var el = document.querySelector('[data-open="' + id + '"]');
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(function () { S.highlightId = null; var e2 = document.querySelector('[data-open="' + id + '"]'); if (e2) e2.classList.remove("hl"); }, 4600);
  }

  /* ================= events ================= */
  function refreshAll() { pingServer(); loadData(false); }

  document.addEventListener("click", function (e) {
    var t = e.target;
    var open = t.closest("[data-open]"), play = t.closest("[data-play]");
    if (play) { e.stopPropagation(); openCall(play.dataset.play, true); return; }
    if (open) { openCall(open.dataset.open, false); return; }
    var f = t.closest("[data-filter]");
    if (f) { S.filter = f.dataset.filter; renderFilters(); renderRows(); return; }
    var d = t.closest("[data-day]");
    if (d) { S.hoverDay = +d.dataset.day; renderChart(); return; }
    if (t.closest("[data-close]")) { closeOverlays(); return; }
    if (t.closest("#btn-del")) { deleteCall(); return; }
    if (t.closest("#retry-load")) { loadData(false); return; }
    if (t.closest("#stage-x")) { closeStage(); return; }
  });
  document.addEventListener("pointerover", function (e) {
    var d = e.target.closest && e.target.closest("[data-day]");
    if (d && e.pointerType === "mouse" && S.hoverDay !== +d.dataset.day) { S.hoverDay = +d.dataset.day; renderChart(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (S.stageOpen) closeStage(); else closeOverlays(); }
  });

  $("btn-talk").onclick = openStage;
  $("btn-refresh").onclick = refreshAll;
  $("nav-refresh").onclick = refreshAll;
  $("nav-script").onclick = openPrompt;
  $("btn-script-m").onclick = openPrompt;
  $("nav-dash").onclick = function () { closeOverlays(); $("main").scrollTo({ top: 0, behavior: "smooth" }); };
  $("srv-btn").onclick = function () { pingServer(); };
  $("srv-chip").onclick = function () { pingServer(); };

  /* ================= boot ================= */
  renderAll();
  // Wake Render first (free tier sleeps), then load data.
  pingServer().then(function () { loadData(true); });
  // Keep things fresh: every 5s while a call is still being processed, otherwise once a minute.
  setInterval(function () {
    if (document.hidden || S.stageOpen || S.refreshing || S.server !== "online") return;
    var proc = S.calls.some(isProcessing);
    var idle = !S.openCallId && !S.promptOpen && Date.now() - (S.lastLoad || 0) > 60000;
    if (proc || idle) loadData(true).then(refreshDrawerMeta);
  }, 5000);
})();
</script>
</body>
</html>
